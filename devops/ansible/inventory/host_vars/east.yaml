# Node-specific configuration for east outpost
---

# Model selection for DepthAI co-processor without SpyGlass support
outpost_models:
  - mobilenet_ssd_depthai

# ImageNode configuration using unified template
imagenode_config:
  node_name: east
  cameras:
    O1:                          # OAK-1 DepthAI camera
      viewname: Front
      resolution: (768, 432)
      framerate: 30
      detector:
        encoder: oak             # oak | cpu (JPEG encoding location)
        detectobjects: none      # SpyGlass not needed with DepthAI
        accelerator: none
        tracker:
          min_confidence_new: 0.60
        #   match_iou: 0.30
        #   gap_misses: 30
        depthai:                 # OAK v3 event-plane config (redesign Phase 3/4)
          # nn_archive (from model_registry) and crop_publish (from
          # sentinelcam_ports) are injected by the template — not set here.
          lookback_frames: 90    # EventSampler entry-phase lookback depth (~3s at 30fps)
          oak_pipeline:
            jpeg_quality: 90
            detection_confidence: 0.5
            rotate_180: true
            camera_fps: 30
            crop_profiles:        # absent keys fall back to oak_camera validated defaults
              person:
                width: 256
                height: 384
                padding: 0.15
                max_area_fraction: 0.35
                min_interval_s: 0.20
                min_iou: 0.70
                edge_margin: 0.05
                max_aspect_deviation: 0.08
              vehicle:
                width: 512
                height: 192
                padding: 0.10
                max_area_fraction: 0.25
                min_interval_s: 0.15
                min_iou: 0.50
                edge_margin: 0.05
                max_aspect_deviation: 0.15
        sentinel_tasks:
          person: GetFaces2
          default: VehicleSpeed
        ROI: (0,40),(100,100)
