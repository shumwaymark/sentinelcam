---
# Sentinel host overrides.

# =============================================================================
# STUDY HOLD — P0 traffic study (2026-07-07)
# =============================================================================
# Ref: dev/P0_TRAFFIC_STUDY_SPEC.md (Recognition Flywheel Phase 0).
# The east street camera's population metrics (over-limit rate, 85th percentile,
# speed distribution) need the COMPLETE measured-vehicle population. The baseline
# vehicle_tracking policy (retention_days 1 / extended_days 2) collapsed every
# event but >45 mph speeders within two days, starving the study.
#
# Hold the full east population for the study window. Self-heals afterward:
# beyond the window, cleanup resumes speed_cutoff-only thinning as normal.
#
# TO RESTORE the baseline when the study concludes:
#   1. Delete this override block (defaults revert to 1 / 2).
#   2. Raise sentinel_cleanup_max_scan_days below to cover the whole hold —
#      NOT optional. Cleanup only scans max_scan_days (14) backwards, so every
#      date older than that window is unreachable forever: reverting retention
#      alone thins the last two weeks and leaves the entire held population on
#      disk permanently. Set it to at least (days since 2026-07-07) + 14 for one
#      catch-up run, then drop it back to the default.
#   3. Re-run deploy-sentinel.yaml.
sentinel_cleanup_vehicle_retention_days: 60
sentinel_cleanup_vehicle_extended_days: 60

# =============================================================================
# SCENE RETENTION — 30 days (dev/SCENE_RETENTION_PLAN.md)
# =============================================================================
# Scene frames are ~99% of the store (measured 2026-08-17: images 360 G, crops
# 2.0 G, CSVs 604 M) and the first thing to lose value. Events keep their index
# row, tracking data, and crops on the retention clock above; only the replay
# footage expires here. ~190 G steady state at the current 6.4 GB/day.
sentinel_cleanup_person_scene_retention_days: 30
sentinel_cleanup_vehicle_scene_retention_days: 30
sentinel_cleanup_default_scene_retention_days: 30

# The scan window must reach PAST the scene window or expiry never fires: the
# default 14 against a 30-day scene policy expires nothing, ever. 45 covers the
# 30-day window plus the 3-day expiry band with room for missed runs.
#
# NOTE this also deepens the reach of the retention pass, from 14 days to 45.
# With deletes enabled, the first run after this change sweeps person_tracking
# and default-profile backlog from 15-45 days ago that was previously
# unreachable. Expected and intended — but it is a one-time larger-than-usual
# deletion, so read one report-only run before enabling if that matters.
sentinel_cleanup_max_scan_days: 45

# CATCH-UP SWEEP (one-time, then revert to the values above).
# To drain accumulated backlog — the study hold, or the pre-scene-retention
# image store — BOTH knobs must be widened. max_scan_days alone does nothing:
# the expiry band gates which events are eligible once a date is in reach, so a
# deep scan with a 3-day band still only touches events 31-33 days old.
# sentinel_cleanup_max_scan_days: 400
# sentinel_cleanup_scene_expiry_band: 400

# =============================================================================
# DELETES ENABLED — inventory is the source of truth
# =============================================================================
# Stated explicitly here because the deployed DailyCleanup.yaml on this node had
# been hand-edited to run_deletes: false, which the role default (true) would
# have silently reverted on the next deploy. The policy belongs in inventory, so
# it is written down: cleanup deletes. Set to false for a report-only dry run —
# the task publishes the same per-date report either way, ending with the
# deleted count and the run_deletes flag it ran under.
sentinel_cleanup_run_deletes: true
