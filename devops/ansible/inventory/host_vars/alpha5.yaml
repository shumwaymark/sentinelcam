# Node-specific configuration for alpha5 outpost
---
# optional co-processor type for this node
#imagenode_accelerator_type: coral  # [none, coral, ncs2]

outpost_models:
  - mobilenet_ssd
  - mobilenet_ssd_edgetpu

# unified template for imagenode configuration
imagenode_config:
  node_name: alpha5
  cameras:
    P1:                          # PiCamera
      viewname: PiCam3
      resolution: (640, 480)
      framerate: 32
      vflip: false
      detector:
        accelerator: coral         # none | ncs2 | coral
        detectobjects: mobilenetssd
        # §4.10 unified lifecycle (see lab1): a tracker DICT selects the persistent
        # host-side tracker + event manager; SpyGlass becomes DETECT-only and motion
        # schedules the EdgeTPU inferences. Same motion-gated path validated on lab1.
        # FOLLOW-UP: Coral can run NN every frame (always-on, OAK-style) — a future
        # scheduler flag — but validate motion-gated first.
        tracker:
          # Starting floor — tune from alpha5's own confidence distribution after the
          # first soak (cf. east 0.60, lab1 0.50). EdgeTPU confidences differ.
          min_confidence_new: 0.50
        sentinel_tasks:
          person: GetFaces2
          default: MobileNetSSD_allFrames
