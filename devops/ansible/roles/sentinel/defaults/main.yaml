---
# Default variables for SentinelCam Sentinel Role
# See group_vars/all/sentinelcam_ports.yaml for port definitions
# See group_vars/all/sentinelcam_standards.yaml for path standards

# Sentinel configuration
sentinel_service: sentinel
sentinel_config_file: sentinel.yaml
sentinel_install_path: "/home/{{ sentinelcam_user }}/sentinel"
sentinel_config_path: "/home/{{ sentinelcam_user }}/sentinel.yaml"

# Hardware Accelerator Configuration
# -----------------------------------
# Supported accelerators:
#   - coral: Google Coral USB Accelerator
#   - cpu: CPU-only inference (slower, no special hardware needed)
#   - ncs2: Intel Neural Compute Stick 2 (deprecated, hardware no longer supported by OpenVINO)
sentinel_accelerator_type: coral

# Virtual environment path
sentinel_venv_path: "{{ sentinelcam_venv_opencv }}"

# OpenVINO environment (LEGACY - only for nodes with an NCS2 accelerator)
openvino_setup_script: "/home/{{ sentinelcam_user }}/openvino/bin/setupvars.sh"
sentinel_venv_path_openvino: "/home/{{ sentinelcam_user }}/.virtualenvs/openvino"

# IPC socket directory (absolute path)
sentinel_socket_dir: "{{ sentinel_install_path }}/sockets"

# Model paths configuration (absolute path)
sentinel_models_path: "{{ sentinel_install_path }}/models"

# Model version overrides (optional per-host customization)
# Override specific model versions in host_vars if testing new models
# Example: model_version_overrides: { face_recognition: "2025-12-01" }
model_version_overrides: {}

# Coral package provisioning flag
# Set to true to install Coral packages during sentinel role provisioning
# Packages are sourced from model registry on primary_datasink
sentinel_install_coral_packages: "{{ sentinel_accelerator_type == 'coral' }}"

# Face Detection Model Selection
# --------------------------------
# Supported EdgeTPU face detection models:
#   - ssd_mobilenet: SSD MobileNet V2 (default, works with get_objects())
#   - blazeface: BlazeFace from MediaPipe (recommended, fewer false positives)
#     - Uses full_range variant (0-5m) - suitable for surveillance
#     - short_range variant (0-2m) is for mobile/selfie use cases
#
# Model selection only applies when sentinel_accelerator_type == 'coral'
# CPU and NCS2 modes always use OpenCV DNN (res10_300x300_ssd)
sentinel_face_detection_model: ssd_mobilenet  # [ssd_mobilenet, blazeface]

# BlazeFace variant selection (when sentinel_face_detection_model == 'blazeface')
#   - full: Full range (0-5m) - RECOMMENDED for surveillance cameras
#   - short: Short range (0-2m) - for mobile/selfie applications
sentinel_blazeface_variant: full  # [full, short]

# Face Detection Model Paths (versioned from registry)
face_detection_base_path: "{{ sentinel_models_path }}/face_detection/{{ model_version_overrides.face_detection | default(sentinelcam_models.face_detection.current_version) }}"
face_detection_edgetpu_path: "{{ sentinel_models_path }}/face_detection_edgetpu/{{ model_version_overrides.face_detection_edgetpu | default(sentinelcam_models.face_detection_edgetpu.current_version) }}"
face_detection_blazeface_path: "{{ sentinel_models_path }}/face_detection_blazeface/{{ model_version_overrides.face_detection_blazeface | default(sentinelcam_models.face_detection_blazeface.current_version) }}"

# Face Detection Model Files
face_detection_prototxt: "{{ face_detection_base_path }}/deploy.prototxt"
face_detection_caffemodel: "{{ face_detection_base_path }}/res10_300x300_ssd_iter_140000.caffemodel"
face_detection_ssd_mobilenet_model: "{{ face_detection_edgetpu_path }}/ssd_mobilenet_v2_face_quant_postprocess_edgetpu.tflite"
face_detection_blazeface_short_model: "{{ face_detection_blazeface_path }}/face_detection_short_range_edgetpu.tflite"
face_detection_blazeface_full_model: "{{ face_detection_blazeface_path }}/face_detection_full_range_edgetpu.tflite"

# Face Detection Confidence Thresholds (model-specific defaults)
# Can be overridden in host_vars per-host
face_detection_confidence:
  cpu: 0.5
  ncs2: 0.5
  ssd_mobilenet: 0.5
  blazeface: 0.5  # Full range works well at 0.5

# Debug mode flag
debug_mode: false

# Engine health heuristic configuration
sentinel_health:
  # Accelerator degradation is a RATE collapse, not a short job. Scoring the
  # frame count restarted healthy engines: a legitimate event with a subject in
  # view but nothing to detect for the duration yields a handful of frames at a
  # perfectly normal rate. Only jobs of at least min_rate_frames are scored,
  # because a short job's rate is dominated by model-load overhead. Measured on
  # a coral engine over 888 completed jobs: healthy p02 16.5 fps, median 26.0.
  low_rate_threshold: 8.0      # frames/sec at or below this scores as degraded
  min_rate_frames: 20          # a job smaller than this is not scored at all
  strike_limit: 3              # consecutive degraded jobs before triggering restart
  fail_strike_limit: 5         # consecutive outright failures before restart
  # Wall-clock ceiling on a RUNNING job. The strike/fail counters both key off a
  # COMPLETION event, so neither can see a job that never ends -- which is what a
  # wedged USB accelerator produces, since its blocking call sits in C where no
  # signal handler runs and no stop flag is read. 0 disables the check; a
  # per-task `runtime_limit` overrides it.
  job_runtime_limit: 900       # seconds
  restart_cooldown: 300        # seconds between automatic restarts per engine
  max_auto_restarts: 10        # lifetime limit before giving up

# State maintenance configuration
sentinel_maintenance:
  retention_hours: 48          # completed job records older than this are trimmed
  state_file: "{{ sentinel_install_path }}/state.json"
  checkpoint_interval: 50      # job completions between incremental checkpoints

# Graceful shutdown configuration
sentinel_shutdown:
  drain_timeout: 60            # seconds to wait for running tasks before force-exit

# Daily cleanup retention policy (DailyCleanup task).
# These variables render tasks/DailyCleanup.yaml so the deployed policy is
# re-created from inventory on every run — never hand-edit the file on the node.
# To tune retention (e.g. a full-population study hold), override the relevant
# scalar in group_vars or host_vars/<sentinel-host>.yaml, then re-run
# deploy-sentinel.yaml. Retention logic: an event is KEPT if ANY data type it
# carries still has value, DELETED only when ALL of it is past retention.
sentinel_cleanup_run_deletes: true       # false = report only, take no action
sentinel_cleanup_max_scan_days: 14       # days to scan backwards from run date
# person_tracking profile (face_quality) — nodes: lab1, alpha5
sentinel_cleanup_person_retention_days: 2
sentinel_cleanup_person_min_face_ratio: 0.15
sentinel_cleanup_person_confidence_threshold: 0.975
# vehicle_tracking profile (vehicle_interest) — nodes: east
# retention_days keeps ALL events (incl. non-speed transits); beyond
# extended_days only vehicles over speed_cutoff survive. Raise both retention
# knobs to hold the full measured-vehicle population for a traffic study.
sentinel_cleanup_vehicle_retention_days: 1
sentinel_cleanup_vehicle_speed_cutoff: 45.0
sentinel_cleanup_vehicle_extended_days: 2
# default fallback profile (minimal_retention)
sentinel_cleanup_default_retention_days: 7
# Scene retention — a SECOND, independent clock, applied to events the retention
# policy above decided to keep. Scene frames are ~99% of the data store and the
# first thing to lose value; the record of what happened (index row, tracking
# CSVs, crops) stays on the retention clock. An event whose scenes expire is
# still indexed, still carries its data, and simply cannot be replayed as video.
# Locked events (model ground truth) are exempt and keep everything.
# null = never expire, so no node changes behavior until its profile opts in.
# NOTE: sentinel_cleanup_max_scan_days must reach PAST the scene window or none
# of this ever fires — a 14-day scan against a 30-day scene policy expires
# nothing. See dev/SCENE_RETENTION_PLAN.md.
sentinel_cleanup_person_scene_retention_days: ~
sentinel_cleanup_vehicle_scene_retention_days: ~
sentinel_cleanup_default_scene_retention_days: ~
# Days past the scene window in which an event is still eligible for expiry.
# Bounds the nightly work: without it every run re-issues deletes for every
# already-expired event still inside the scan window. Wide enough to absorb a
# few missed nightly runs; widen it for a one-time catch-up sweep.
sentinel_cleanup_scene_expiry_band: 3

# Ring buffer models - image sizes and buffer lengths
sentinel_ring_buffer_models:
  default:
    vga:
      size: [640, 480]
      buffer_length: 5
    sd:
      size: [640, 360]
      buffer_length: 5
    hd:
      size: [768, 432]      # OAK scene-publish size (redesign); all engines use `default`
      buffer_length: 5

# Task engines configuration
sentinel_task_engines:
  Alpha:
    classes: [1]
    ring_buffers: default
    accelerator: "{{ sentinel_accelerator_type }}"
  Bravo1:
    classes: [2]
    ring_buffers: default
    accelerator: cpu
  Bravo2:
    classes: [2, 3]
    ring_buffers: default
    accelerator: cpu

# Available tasks configuration
sentinel_tasks:
  MobileNetSSD_allFrames:
    config_file: MobileNetSSD_allFrames.yaml
    chain: GetFaces
    class: 1
  GetFaces:
    config_file: GetFaces.yaml
    chain: FaceRecon
    class: 1
    trk_type: obj
    ringctrl: full
  FaceRecon:
    config_file: FaceRecon.yaml
    class: 2
    trk_type: fd1
    ringctrl: trk
  FaceSweep:
    config_file: FaceSweep.yaml
    class: 2
  FaceDataUpdate:
    config_file: FaceDataUpdate.yaml
    class: 2
  GetFaces2:
    alias: GetFaces
    config_file: GetFaces.yaml
    chain: FaceRecon
    class: 1
  VehicleSpeed:
    config_file: VehicleSpeed.yaml
    class: 2
  DailyCleanup:
    config_file: DailyCleanup.yaml
    class: 3
  MeasureRingLatency:
    config_file: MeasureRingLatency.yaml
    class: 1
