---
# Configure delayed WireGuard startup to ensure network is ready
#
# NOTE: wireguard.yaml already deploys the templated service and timer.
# This task only deploys the convenience management script.
# Do NOT redeploy the systemd service here — it would overwrite
# the templated version from wireguard.yaml.

- name: "Create WireGuard startup delay script"
  ansible.builtin.copy:
    dest: /usr/local/bin/wireguard-delayed-start.sh
    content: |
      #!/bin/bash
      # Wait for NetworkManager to fully initialize
      sleep 10

      # Check if WAN interface is up
      while ! nmcli device status | grep -q "{{ bastion_interfaces.external.name }}.*connected"; do
        sleep 2
      done

      # Bring up WireGuard connection
      nmcli connection up wg0
    mode: '0755'
    owner: root
    group: root
