name: YAML Consistency Check

on:
  pull_request:
    paths:
      - '**/*.yml'
      - '**/*.yaml'

jobs:
  yaml-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for .yml files
        run: |
          yml_files=$(find . -name "*.yml" -not -path "./.git/*")
          if [ ! -z "$yml_files" ]; then
            echo "❌ Found .yml files that should use .yaml extension:"
            echo "$yml_files"
            echo ""
            echo "SentinelCam project uses .yaml for consistency."
            exit 1
          fi
          echo "✅ All YAML files use .yaml extension"
          
      - name: Validate YAML syntax
        run: |
          find . -name "*.yaml" -not -path "./.git/*" | while read file; do
            echo "Checking $file"
            python -c "import yaml; yaml.safe_load(open('$file'))"
          done
