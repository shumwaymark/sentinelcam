%YAML 1.0
---
# Settings file sentinel.yaml
control_port: 5566
logging_port: 5565
default_pump: tcp://data1:5556
socket_dir: /home/ops/sentinel/sockets

# For ring buffer allocations, any potential image size must
# be known in advance. Each of the task_engines need a set of
# ring buffers. Parameters are ((width, height), buffer_length)
ring_buffer_models:
    default:
        vga: ((640, 480), 5)
        sd: ((640, 360), 5)

# Probably no more than three of these on a Raspberry Pi 4B?
# Ideally, one would have a dedicated co-processor for real-time
# response, and others for background maintenance tasks requiring
# only low to moderate CPU resources. Scheduling batch workloads
# into idle time periods is helpful.
task_engines:
    Alpha:
        classes: [1]
        ring_buffers: default
        accelerator: coral      # [cpu, ncs2, coral]
    Bravo1:
        classes: [2]
        ring_buffers: default
        accelerator: cpu
    Bravo2:
        classes: [2,3]
        ring_buffers: default
        accelerator: cpu

# The list of currently available tasks. These can be configured
# by job class to have an affinity with a particular task engine.
# Each task must have a matching class definition in the TaskFactory
# or include an alias reference to the underlying task.
task_list:
    MobileNetSSD_allFrames:
        config: /home/ops/sentinel/tasks/MobileNetSSD_allFrames.yaml
        chain: GetFaces  # optional, next task when this completes
        class: 1
    GetFaces:
        config: /home/ops/sentinel/tasks/GetFaces.yaml
        chain: FaceRecon
        class: 1
        trk_type: obj    # desired tracking feed, default = trk
        ringctrl: full   # [full, trk]  default = full
    FaceRecon:
        config: /home/ops/sentinel/tasks/FaceRecon.yaml
        class: 2
        trk_type: fd1    # desired tracking feed, default = trk
        ringctrl: trk    # [full, trk]  default = full
    FaceSweep:
        config: /home/ops/sentinel/tasks/FaceSweep.yaml
        class: 2
    FaceDataUpdate:
        config: /home/ops/sentinel/tasks/FaceDataUpdate.yaml
        class: 2
    GetFaces2:
        alias: GetFaces
        config: /home/ops/sentinel/tasks/GetFaces.yaml
        chain: FaceRecon
        class: 1
    VehicleSpeed:
        config: /home/ops/sentinel/tasks/VehicleSpeed.yaml
        class: 2
    DailyCleanup:
        config: /home/ops/sentinel/tasks/DailyCleanup.yaml
        class: 3
    MeasureRingLatency:
        config: /home/ops/sentinel/tasks/MeasureRingLatency.yaml
        class: 1

# Engine health heuristics for automatic degradation detection
health:
  # Accelerator degradation is a RATE collapse, not a short job. Scoring the
  # frame count restarted healthy engines: a legitimate event with a subject in
  # view but nothing to detect for the duration yields a handful of frames at a
  # perfectly normal rate. Only jobs of at least min_rate_frames are scored,
  # because a short job's rate is dominated by model-load overhead. Measured on
  # a coral engine over 888 completed jobs: healthy p02 16.5 fps, median 26.0.
  # Scored on throughput with fixed per-job startup discounted, NOT on the job's
  # wall-clock rate -- that number is dominated by model load and so tracks job
  # SIZE as much as device health, which restarted a healthy engine ~daily.
  # Measured on a coral engine: elapsed ~= 2.83s fixed + images / 26.8 fps.
  # Discounted, every job size converges on ~27 fps, so this threshold finally
  # means one thing: 8.0 is "under 30% of normal throughput".
  startup_allowance: 3.0       # sec of fixed per-job cost to discount
  low_rate_threshold: 8.0      # corrected frames/sec at or below this = degraded
  min_rate_frames: 20          # a job smaller than this is not scored at all
  strike_limit: 3              # consecutive degraded jobs before triggering restart
  fail_strike_limit: 5         # consecutive outright failures before restart
  # Wall-clock ceiling on a RUNNING job. The strike/fail counters both key off a
  # COMPLETION event, so neither can see a job that never ends -- which is what a
  # wedged USB accelerator produces, since its blocking call sits in C where no
  # signal handler runs and no stop flag is read. 0 disables the check; a
  # per-task `runtime_limit` overrides it.
  job_runtime_limit: 900       # seconds
  restart_cooldown: 300        # seconds between automatic restarts per engine
  max_auto_restarts: 10        # lifetime limit before giving up

# State maintenance: daily summaries, checkpointing, and history trimming
maintenance:
  state_file: ~/sentinel/state.json
  retention_hours: 48          # completed job records older than this are trimmed
  checkpoint_interval: 50      # job completions between incremental checkpoints

# Graceful shutdown configuration
shutdown:
  drain_timeout: 60            # seconds to wait for running tasks before force-exit

# Configure logging publication over 0MQ
logconfig:
    version: 1
    handlers:
        zmq:
            class: zmq.log.handlers.PUBHandler
            interface_or_socket: tcp://*:5565
            root_topic: Sentinel
            level: INFO
    root:
        handlers: [zmq]
        level: INFO
