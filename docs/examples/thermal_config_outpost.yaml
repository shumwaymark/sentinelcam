# Outpost Host Thermal Monitoring Configuration
# File: ansible/host_vars/deepend/thermal_monitoring.yaml
#
# Deepend is an outpost node with dual accelerators:
# - Coral USB for MobileNetSSD person detection (primary lens)
# - DepthAI OAK-D for spatial AI and depth processing (auxiliary lens)
#
# Real-time processing typically has natural breaks between events, but
# thermal monitoring provides protection during extended events (parties,
# gatherings, maintenance activities).

thermal_monitoring:
  enabled: true

  accelerators:
    # Coral USB configuration
    coral:
      window_size: 25
      check_interval: 25
      degradation_threshold: 1.5
      cooldown_duration: 30

    # DepthAI OAK-D configuration
    # Uses hardware temperature sensors for more accurate detection
    depthai:
      # Slightly larger window - OAK thermals more stable than Coral USB
      window_size: 30

      # Same check frequency
      check_interval: 25

      # Tighter threshold - we have temp sensors for ground truth
      degradation_threshold: 1.3

      # Shorter cooldown - better thermal management in M.2 form factor
      cooldown_duration: 25

      # Hardware temperature threshold (Celsius)
      # DepthAI provides device.getChipTemperature() API
      # Typical operating range: 40-70°C, throttle ~80°C
      temperature_threshold: 80.0

  log_level: INFO

# Expected behavior:
# - Coral: 0-2 cooldowns per day (mostly during extended events)
# - DepthAI: Rare cooldowns (excellent thermal design)
# - DepthAI temp-based detection may trigger before performance degrades
#
# Hardware context:
# - Raspberry Pi 4B with both accelerators
# - Coral USB on USB 3.0 port (prefer port closest to network jack)
# - DepthAI via USB-C (provides power + data)
# - Ensure adequate airflow around Pi case
#
# Monitoring:
# - Track temperature trends for DepthAI (available in metrics)
# - Compare Coral performance between powered hub vs direct connection
# - Watch for simultaneous cooldowns (indicates ambient temp issue)
