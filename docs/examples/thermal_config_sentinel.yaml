# Sentinel Host Thermal Monitoring Configuration
# File: ansible/host_vars/clovis/thermal_monitoring.yaml
#
# Clovis is the sentinel server with 3 task engines sharing 1 Coral USB.
# Batch processing workloads run for extended periods without natural breaks,
# making thermal monitoring essential for sustained performance.

thermal_monitoring:
  enabled: true

  # Single Coral USB configuration
  # All 3 task engines use this shared config
  accelerators:
    coral:
      # Timing window - collect 25 frames (~0.75s at 30fps) for baseline
      window_size: 25

      # Check frequency - test for degradation every 25 frames
      # Balance: too frequent adds overhead, too infrequent misses throttling
      check_interval: 25

      # Degradation threshold - trigger at 1.5x baseline
      # Example: 30ms baseline → trigger at 45ms+
      degradation_threshold: 1.5

      # Cooldown duration - pause processing for 30 seconds
      # Allows Coral USB to cool from ~70°C to ~50°C
      cooldown_duration: 30

  # Logging configuration
  log_level: INFO  # Change to DEBUG for detailed per-frame metrics

  # Future: Multi-Coral support (when dual-Coral deployed)
  # stagger_cooldowns: true
  # cooldown_stagger_delay: 15

# Expected behavior:
# - Baseline establishes after first 25 frames of each job
# - During overnight batch runs, expect 1-3 cooldowns per 8-hour job
# - Cooldowns typically trigger after 30-45 minutes of continuous inference
# - Performance should recover to baseline after each cooldown
#
# Monitoring:
# - Watch sentinel logs for "THERMAL_COOLDOWN" events
# - Query camwatcher for cooldown frequency trends
# - Alert if cooldown rate exceeds 5 per hour (indicates inadequate cooling)
