# Power budget:
# - Raspberry Pi 4B: 600mA idle, 1.25A peak = ~6.25W
# - Coral USB x2: 500mA each = ~5W combined
# - Total: ~11.25W peak (3A @ 5V = 15W capacity, 75% utilization)
