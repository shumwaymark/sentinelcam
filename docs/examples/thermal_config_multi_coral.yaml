# Future Multi-Coral Sentinel Configuration
# File: ansible/host_vars/clovis/thermal_monitoring.yaml
#
# Configuration for sentinel with dual Coral USB accelerators.
# NOT YET DEPLOYED - reference for future expansion.
#
# Architecture:
# - 3 task engines, 2 Coral USB devices
# - Engine assignment: 2 engines on Coral A, 1 engine on Coral B
# - Or: Round-robin assignment per job
#
# Challenge: Both devices share single thermal_monitoring.coral config
# Solution: Staggered cooldowns prevent simultaneous downtime

thermal_monitoring:
  enabled: true

  accelerators:
    coral:
      window_size: 25
      check_interval: 25
      degradation_threshold: 1.5
      cooldown_duration: 30

  # Multi-device coordination
  # Prevent both Corals cooling simultaneously
  stagger_cooldowns: true

  # If one Coral cooling, delay second cooldown by this many seconds
  # Ensures at least one Coral remains operational
  cooldown_stagger_delay: 15

  log_level: INFO

