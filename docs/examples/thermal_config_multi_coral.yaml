# Hardware setup:
# - Coral A: USB 3.0 port 1 (blue, top-left)
# - Coral B: USB 3.0 port 2 (blue, top-right)
# - Both on powered USB 3.0 hub (recommended)
# - 3A power supply sufficient for dual Coral + Pi4B
