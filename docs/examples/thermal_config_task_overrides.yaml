# Task-Specific Thermal Override Example
# File: sentinel.yaml (task_list section)
#
# Most tasks inherit thermal config from host_vars, but some tasks may need
# different behavior based on model characteristics or workload patterns.

task_list:
  # Standard task - uses host-level thermal config
  personDetection:
    class: Detection
    config:
      model: mobilenet_ssd
      confidence: 0.5
      nms_threshold: 0.4

  # Heavy model - needs less aggressive checking, longer cooldown
  gamma4:
    class: Detection
    alias: FaceDetection
    config:
      model: gamma4_model
      confidence: 0.3

      # Task-specific thermal override
      # Gamma4 is compute-intensive: 40-50ms per frame vs 30ms for lighter models
      # Override rationale:
      # - check_interval: 50 (less frequent checks for slower model)
      # - cooldown_duration: 45 (longer recovery for heavy workload)
      # - degradation_threshold: 1.6 (allow more variance in heavy model)
      thermal_monitoring:
        check_interval: 50
        cooldown_duration: 45
        degradation_threshold: 1.6

  # Lightweight task - more aggressive monitoring
  motionDetection:
    class: Detection
    config:
      model: background_subtraction

      # Very fast inference (~5ms), can check more frequently
      thermal_monitoring:
        check_interval: 100  # Still check, but less often (fast inference)
        window_size: 50      # Larger window for stable baseline
        degradation_threshold: 2.0  # Higher threshold (less thermal sensitive)

  # CPU-only task - different thermal characteristics
  faceRecognition:
    class: Recognition
    config:
      model: facenet
      accelerator: cpu  # This task uses CPU, not Coral

      # CPU thermal config
      # CPUs throttle differently than USB accelerators
      thermal_monitoring:
        window_size: 50
        check_interval: 50
        degradation_threshold: 2.0  # CPUs have more headroom
        cooldown_duration: 20       # Shorter cooldown (active cooling)

  # No monitoring needed - non-inference task
  librarian:
    class: Librarian
    config:
      database: postgresql
      # No thermal_monitoring block - this task doesn't do inference
      # Monitor creation skipped automatically

# Configuration merge logic:
#
# Task-level thermal_monitoring overrides specific keys in host-level config:
#
# Host config (from ansible/host_vars):
#   accelerators.coral = {window_size: 25, check_interval: 25,
#                         degradation_threshold: 1.5, cooldown_duration: 30}
#
# Task override:
#   thermal_monitoring = {check_interval: 50, cooldown_duration: 45}
#
# Effective config for task:
#   {window_size: 25, check_interval: 50,
#    degradation_threshold: 1.5, cooldown_duration: 45}
#
# Implementation in sentinel.py taskHost():
#   # Load host-level config
#   thermal_config = CFG['thermal_monitoring']['accelerators'].get(accelerator, {})
#
#   # Apply task-level overrides if present
#   if 'thermal_monitoring' in taskcfg['config']:
#       thermal_config.update(taskcfg['config']['thermal_monitoring'])
#
#   # Create monitor with merged config
#   thermal_monitor = create_monitor(accelerator, config=thermal_config)

# When to use task overrides:
#
# ✓ DO override when:
#   - Model significantly slower/faster than baseline (40ms vs 30ms)
#   - Task has unique thermal characteristics (batch processing patterns)
#   - Task criticality requires different cooldown behavior
#   - Experimenting with optimal parameters for specific workload
#
# ✗ DON'T override when:
#   - Task uses same models/inference as others (avoid config duplication)
#   - Difference in timing is minor (<20% variance)
#   - Host-level config working well (premature optimization)
#   - Task doesn't do inference (monitor won't be created anyway)
